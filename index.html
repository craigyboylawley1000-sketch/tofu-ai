<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tofu AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app">

    <header class="topbar">
      <button class="menu" id="menuButton">☰</button>

      <div class="model">
        <strong>Tofu AI</strong>
        <span>✦</span>
      </div>

      <button class="new-chat" id="newChat">＋</button>
    </header>

    <main id="chat" class="chat">
      <div class="welcome">
        <div class="logo">✦</div>
        <h1>How can I help?</h1>
        <p>Ask Tofu anything.</p>
      </div>
    </main>

    <footer>
      <div class="input-box">
        <input type="file" id="imageInput" accept="image/*" hidden>

<button id="imageButton" type="button">📷</button>
<textarea id="messageInput" placeholder="Message Tofu..." rows="1"></textarea>
<button id="sendButton">↑</button>
      </div>

      <div class="disclaimer">
        Tofu AI can make mistakes. Check important information.
      </div>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
